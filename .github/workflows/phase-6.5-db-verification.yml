name: Phase 6.5 — Database Persistence Verification

# Narrowly scoped verification infrastructure only (see
# docs/phase-6.5-ci-verification.md). This workflow does not build, deploy, or publish
# anything. It runs two independent jobs, each on the runner platform its own suite
# actually needs:
#   - verify-backend-persistence (ubuntu-latest): the backend suite, including the 21
#     Testcontainers-based real-PostgreSQL integration tests in
#     EfPostgresPersistenceTests.cs, run completely unmodified.
#   - verify-core-suite (windows-latest): the existing VTTranslate.Core.Tests suite,
#     which targets net8.0-windows (WASAPI/NAudio) and needs the real Windows Desktop
#     runtime — not present on Ubuntu, and not something this workflow attempts to fake
#     or work around there. Both jobs must pass for the workflow to succeed.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  verify-backend-persistence:
    # ubuntu-latest GitHub-hosted runners ship with a working Docker daemon already
    # running — exactly what Testcontainers.PostgreSql needs to start a real postgres
    # container. No self-hosted runner, no Docker-in-Docker setup, no SQLite/in-memory
    # substitute is introduced anywhere in this job.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Confirm Docker is available (required for real-PostgreSQL tests)
        run: docker version

      - name: "Build backend projects only (not VTTranslate.App/Core — see below)"
        # This job verifies Phase 6.5 PostgreSQL persistence, not the Windows WPF app or
        # VTTranslate.Core — so it builds only the backend test project's own dependency
        # graph (Domain -> Application -> Infrastructure -> Api -> Tests), never
        # VTTranslate.sln. Neither VTTranslate.App nor VTTranslate.Core (both
        # net8.0-windows) is referenced by that graph and neither is built here.
        run: dotnet build tests/VTTranslate.Backend.Tests/VTTranslate.Backend.Tests.csproj --configuration Release

      - name: "Run backend test suite (includes 21 real-PostgreSQL Testcontainers tests)"
        # Run exactly as implemented — no filter excludes EfPostgresPersistenceTests, no
        # environment variable disables Docker, no substitute connection string is
        # supplied. --logger reports exact pass/skip/fail counts in the job output.
        run: >
          dotnet test tests/VTTranslate.Backend.Tests/VTTranslate.Backend.Tests.csproj
          --configuration Release
          --logger "console;verbosity=detailed"
          --logger "trx;LogFileName=backend-tests.trx"
          --results-directory ./test-results

      - name: Upload backend test result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-6.5-backend-test-results
          path: ./test-results/*.trx

  verify-core-suite:
    # windows-latest carries the real Windows Desktop runtime
    # (Microsoft.WindowsDesktop.App), which VTTranslate.Core.Tests genuinely needs
    # (VTTranslate.Core targets net8.0-windows — WASAPI/NAudio). Running this suite on
    # its native platform means no EnableWindowsTargeting override or any other
    # cross-compilation workaround is needed here at all.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: "Run existing Windows/Core test suite (baseline: 399/399)"
        run: dotnet test tests/VTTranslate.Core.Tests/VTTranslate.Core.Tests.csproj --configuration Release --logger "console;verbosity=detailed" --logger "trx;LogFileName=core-tests.trx" --results-directory ./test-results

      - name: Upload Core test result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-6.5-core-test-results
          path: ./test-results/*.trx
